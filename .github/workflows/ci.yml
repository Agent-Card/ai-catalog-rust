---
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-lint-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt

      - name: Install just
        uses: taiki-e/install-action@6155d2cb312b464292646e69dce00eee78f23151

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build
        run: just build

      - name: Lint
        run: just lint

      - name: Test
        run: just test

  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.95.0
          components: llvm-tools-preview

      - name: Install just
        uses: taiki-e/install-action@6155d2cb312b464292646e69dce00eee78f23151

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@e5de28abeb52d916c5e5875d54b21a9e738b61ec

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run coverage
        run: |
          just coverage | tee coverage-summary.txt
          {
            echo '## Coverage'
            echo '```text'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-summary
          path: coverage-summary.txt

  success:
    name: Success
    needs:
      - build-lint-test
      - coverage
    # This gate must run even when a dependency fails. A job that is skipped
    # reports its status as "Success" and does not block a required check, so
    # the failure has to be raised explicitly below.
    # https://github.com/actions/runner/issues/2566
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    steps:
      - name: Check dependency results
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1
