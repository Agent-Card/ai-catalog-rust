[workspace]
members = [
  "crates/ai-catalog",
  "crates/ai-catalog-validate",
  "crates/ai-catalog-trust",
  "crates/ai-catalog-oci",
  "crates/ai-catalog-cli",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/agntcy/ai-catalog-rust"
rust-version = "1.95"
version = "0.1.0"

[workspace.dependencies]
ai-catalog = { path = "crates/ai-catalog", version = "0.1.0" }
ai-catalog-oci = { path = "crates/ai-catalog-oci", version = "0.1.0" }
ai-catalog-trust = { path = "crates/ai-catalog-trust", version = "0.1.0" }
ai-catalog-validate = { path = "crates/ai-catalog-validate", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing"] }
async-recursion = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
colored = "2"
dirs = "5"
hex = "0.4"
regex = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
url = "2"
